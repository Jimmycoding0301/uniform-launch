services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - --fork-url
      - ${BSC_TESTNET_RPC_URL:-https://bsc-testnet-rpc.publicnode.com}
      - --host
      - 0.0.0.0
      - --port
      - "18545"
      - --chain-id
      - "97"
      - --auto-impersonate
    ports:
      - "18545:18545"
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./web:/app
    entrypoint: ["sh", "-c"]
    command: "npm ci && npm run dev -- --host 0.0.0.0 --port 4317"
    ports:
      - "4317:4317"
    depends_on:
      - anvil
