[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]
fuzz = { runs = 1024 }

[invariant]
runs = 40
depth = 20
fail_on_revert = true

[fmt]
line_length = 120
