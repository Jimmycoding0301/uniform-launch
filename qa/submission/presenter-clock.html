<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070808">
  <title>Uniform Launch · Presenter Clock</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070808;
      --panel: #141616;
      --line: #303236;
      --text: #f2f4f1;
      --muted: #abb0ab;
      --accent: #91f85b;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { width: min(100% - 40px, 920px); margin: 0 auto; padding: clamp(24px, 6vh, 70px) 0; }
    header, .toolbar, .controls, .clock-meta, .cue-heading { display: flex; align-items: center; }
    header { justify-content: space-between; gap: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(20px, 3vw, 30px); letter-spacing: -.035em; }
    .brand { color: var(--muted); font-size: 15px; font-weight: 550; }
    .toolbar { justify-content: space-between; gap: 12px; margin: 24px 0 20px; }
    fieldset { display: flex; gap: 4px; margin: 0; padding: 4px; border: 1px solid var(--line); border-radius: 7px; }
    .sr-only, fieldset input { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); }
    fieldset label { display: inline-block; padding: 7px 13px; border-radius: 4px; cursor: pointer; color: var(--muted); font-weight: 650; }
    fieldset input:checked + label { background: var(--accent); color: var(--bg); }
    button:focus-visible, fieldset input:focus-visible + label { outline: 2px solid var(--text); outline-offset: 3px; }
    #status { color: var(--muted); font-size: 15px; }
    .clock { padding: clamp(18px, 4vw, 38px); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .clock-meta { justify-content: space-between; gap: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
    #remaining { margin: .08em 0 .14em; color: var(--accent); font-size: clamp(74px, 17vw, 170px); font-weight: 650; line-height: 1; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
    progress { display: block; width: 100%; height: 5px; border: 0; border-radius: 0; background: var(--line); accent-color: var(--accent); }
    progress::-webkit-progress-bar { background: var(--line); }
    progress::-webkit-progress-value { background: var(--accent); }
    progress::-moz-progress-bar { background: var(--accent); }
    .cues { display: grid; grid-template-columns: 3fr 2fr; margin-top: 24px; }
    .cue { padding: 6px 20px 8px 0; }
    .cue + .cue { padding-left: 24px; padding-right: 0; border-left: 1px solid var(--line); }
    .cue-heading { gap: 10px; color: var(--muted); font-size: 14px; }
    .cue-heading h2 { font-size: inherit; font-weight: 500; }
    .cue-heading time { font-variant-numeric: tabular-nums; }
    .cue p { margin-top: 10px; font-size: clamp(21px, 3.2vw, 33px); line-height: 1.32; font-weight: 650; }
    .cue + .cue p { font-size: clamp(18px, 2.4vw, 25px); }
    .controls { flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    button { min-height: 44px; padding: 7px 20px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; font-weight: 650; cursor: pointer; }
    #toggle { min-width: 112px; background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .shortcuts { margin-left: auto; color: var(--muted); font-size: 13px; }
    @media (max-width: 520px) {
      main { width: calc(100% - 28px); }
      .cues { grid-template-columns: 1fr; gap: 14px; }
      .cue + .cue { border-left: 0; border-top: 1px solid var(--line); padding: 16px 0 0; }
      .shortcuts { width: 100%; margin: 3px 0 0; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>Presenter Clock</h1><span class="brand">Uniform Launch</span></header>
    <div class="toolbar">
      <fieldset>
        <legend class="sr-only">Presentation length</legend>
        <input type="radio" id="mode120" name="mode" value="120" checked><label for="mode120">120s</label>
        <input type="radio" id="mode60" name="mode" value="60"><label for="mode60">60s</label>
      </fieldset>
      <span id="status" role="status">Ready</span>
    </div>
    <div class="clock">
      <div class="clock-meta"><span>Remaining</span><span>Elapsed <span id="elapsed">00:00</span></span></div>
      <p id="remaining" role="timer" aria-label="Time remaining">02:00</p>
      <progress id="progress" aria-label="Time elapsed" max="120" value="0"></progress>
    </div>
    <section class="cues" aria-label="Presentation cues" aria-live="polite" aria-atomic="true">
      <div class="cue"><div class="cue-heading"><h2>Current cue</h2><time id="current-time"></time></div><p id="current" lang="zh-CN"></p></div>
      <div class="cue"><div class="cue-heading"><h2>Next cue</h2><time id="next-time"></time></div><p id="next" lang="zh-CN"></p></div>
    </section>
    <div class="controls">
      <button id="toggle" type="button" aria-keyshortcuts="Space">Start</button>
      <button id="reset" type="button" aria-keyshortcuts="R">Reset</button>
      <span class="shortcuts">Space · Start / pause &nbsp; R · Reset</span>
    </div>
  </main>
  <script>
    const cue = {
      cover: "封面 · 讲开场",
      mechanism: "机制 · 指预算和最高价",
      demo: "第 3 页 · 切到演示",
      high: "选高限价 · 看成交",
      low: "选低限价 · 看退回",
      settle: "打开发射回执 · 指入池金额",
      claim: "打开领取回执 · 指到账数量",
      vault: "第 5 页 · 讲 Flap 界面与 Vault",
      stop: "停止演示"
    };
    const schedules = {
      120: [
        [0, cue.cover], [12, "身份登记 · 指测试网替身和 Success"],
        [18, "工厂创建 · 指新 Launcher"], [22, "出价回执 · 指 4.45 tBNB"],
        [26, "第 2 页 · 指清算、发射和退款"],
        [36, cue.demo], [44, cue.high], [58, cue.low], [72, cue.settle],
        [88, cue.claim], [101, "第 5 页 · 指自制 Flap 界面"],
        [108, "展示 Vault 分叉提款"], [115, "展示 GitHub · 两个赛道共用"],
        [120, cue.stop]
      ],
      60: [
        [0, cue.cover], [8, cue.mechanism], [17, cue.demo], [20, cue.high],
        [28, cue.low], [35, cue.settle], [44, cue.claim], [52, cue.vault], [60, cue.stop]
      ]
    };
    const byId = id => document.getElementById(id);
    const toggle = byId("toggle");
    const progress = byId("progress");
    let duration = 120;
    let startedAt = null;
    let savedMs = 0;
    let frame = 0;
    let lastCue = -1;
    let lastSecond = -1;

    function format(seconds) {
      return [Math.floor(seconds / 60), seconds % 60].map(n => String(n).padStart(2, "0")).join(":");
    }

    function elapsedMs(now) {
      const activeMs = startedAt === null ? 0 : Math.max(0, now - startedAt);
      return Math.min(duration * 1000, savedMs + activeMs);
    }

    function render(now) {
      cancelAnimationFrame(frame);
      const ms = elapsedMs(now);
      const second = Math.floor(ms / 1000);
      const done = second === duration;
      if (done) {
        savedMs = duration * 1000;
        startedAt = null;
      }
      if (second !== lastSecond) {
        byId("elapsed").textContent = format(second);
        byId("remaining").textContent = format(duration - second);
        progress.value = second;
        lastSecond = second;
      }
      const cues = schedules[duration];
      const current = cues.findLastIndex(([time]) => time <= second);
      if (current !== lastCue) {
        const [currentTime, currentText] = cues[current];
        const next = cues[current + 1];
        byId("current-time").textContent = format(currentTime);
        byId("current").textContent = currentText;
        byId("next-time").textContent = next ? format(next[0]) : "";
        byId("next").textContent = next ? next[1] : "已结束";
        lastCue = current;
      }
      const status = done ? "Finished" : startedAt !== null ? "Running" : savedMs > 0 ? "Paused" : "Ready";
      if (byId("status").textContent !== status) byId("status").textContent = status;
      const label = done ? "Restart" : startedAt !== null ? "Pause" : savedMs > 0 ? "Resume" : "Start";
      if (toggle.textContent !== label) toggle.textContent = label;
      if (startedAt !== null) frame = requestAnimationFrame(render);
    }

    function reset() {
      savedMs = 0;
      startedAt = null;
      lastCue = -1;
      lastSecond = -1;
      progress.max = duration;
      render(performance.now());
    }

    function toggleClock() {
      const now = performance.now();
      if (startedAt !== null) {
        savedMs = elapsedMs(now);
        startedAt = null;
      } else {
        if (savedMs === duration * 1000) savedMs = 0;
        startedAt = now;
      }
      render(now);
    }

    toggle.addEventListener("click", toggleClock);
    byId("reset").addEventListener("click", reset);
    document.querySelectorAll('input[name="mode"]').forEach(input => {
      input.addEventListener("change", () => { duration = Number(input.value); reset(); });
    });
    document.addEventListener("keydown", event => {
      if (event.ctrlKey || event.altKey || event.metaKey || event.repeat) return;
      if (event.code === "Space" && !event.target.closest("button,input,label")) {
        event.preventDefault();
        toggleClock();
      } else if (event.key.toLowerCase() === "r") {
        event.preventDefault();
        reset();
      }
    });
    document.addEventListener("visibilitychange", () => render(performance.now()));
    reset();
  </script>
</body>
</html>
